spring:
  application.name: api

  # Database configurations
  datasource:
    url: ${JTASKS_DB_URL}
    username: ${JTASKS_DB_USERNAME}
    password: ${JTASKS_DB_PASSWORD}

  jpa.hibernate.ddl-auto: none

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JTASKS_JWT_SECRET}
    access-ttl: 1d

  cors:
    allowed-origins: ${JTASKS_ALLOWED_ORIGINS}
    allowed-methods: ${JTASKS_ALLOWED_METHODS}
    allowed-headers: ${JTASKS_ALLOWED_HEADERS}

server:
  port: ${JTASKS_SERVER_PORT}
  servlet.context-path: /api
